<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ordinary._.but — editor</title><style>*{box-sizing:border-box}body{font:15px system-ui,sans-serif;background:#f1f1ef;color:#222;margin:0}main{max-width:1000px;margin:auto;padding:20px}h1{font-size:22px;font-weight:500}section{display:grid;grid-template-columns:1fr 1fr;gap:24px}textarea,input,select,button{font:inherit}textarea{width:100%;height:180px;padding:12px;border:1px solid #ccc;border-radius:6px}label{display:flex;justify-content:space-between;align-items:center;margin:12px 0;gap:10px}button,select{padding:9px;border:1px solid #bbb;border-radius:6px;background:white}button{cursor:pointer}canvas{width:100%;height:auto;display:block;box-shadow:0 2px 12px #0002}.buttons{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}#save{background:#222;color:white}#warn{color:#a33} @media(max-width:700px){section{grid-template-columns:1fr}}</style><main><h1>ordinary._.but <small> / editor</small></h1><section><div><div class="buttons"><button id="prev">←</button><span id="count"></span><button id="next">→</button><button id="add">ページ追加</button><button id="del">削除</button></div><textarea id="txt" placeholder="文章を入力"></textarea><label>組み方向<select id="dir"><option value="h">横組み</option><option value="v">縦組み</option></select></label><label>書体<select id="font"><option value="sans-serif">ゴシック</option><option value="serif">明朝</option></select></label><label>文字サイズ <output id="fsout"></output><input id="fs" type="range" min="24" max="100" value="54"></label><label>余白 <output id="mgout"></output><input id="mg" type="range" min="60" max="300" value="135"></label><label>行間<input id="lh" type="range" min="1.1" max="2.4" step="0.1" value="1.7"></label><label>字間<input id="ls" type="range" min="0" max="20" value="0"></label><label>背景色<input id="bg" type="color" value="#ffffff"></label><label>文字色<input id="fg" type="color" value="#222222"></label><label>署名を表示<input id="sig" type="checkbox"></label><p id="warn"></p><div class="buttons"><button id="save">画像を保存・共有</button><button id="all">全ページを共有</button></div></div><div><canvas id="cv" width="1080" height="1350"></canvas></div></section><p id="sharestatus" role="status"></p><div id="fallback"></div></main><script>const $=id=>document.getElementById(id),c=$('cv'),g=c.getContext('2d');const keys=['dir','font','fs','mg','lh','ls','bg','fg','sig'];let pages=[{txt:'',dir:'h',font:'sans-serif',fs:'54',mg:'135',lh:'1.7',ls:'0',bg:'#ffffff',fg:'#222222',sig:false}],i=0;try{let p=JSON.parse(localStorage.getItem('ordinary-editor-v1'));if(Array.isArray(p)&&p.length)pages=p}catch{}function persist(){try{localStorage.setItem('ordinary-editor-v1',JSON.stringify(pages))}catch{}}function load(){let p=pages[i];$('txt').value=p.txt;keys.forEach(k=>k==='sig'?$(k).checked=p[k]:$(k).value=p[k]);$('count').textContent=`${i+1} / ${pages.length}`;draw()}function update(){let p=pages[i];p.txt=$('txt').value;keys.forEach(k=>p[k]=k==='sig'?$(k).checked:$(k).value);persist();draw()}function render(p){let f=+p.fs,m=+p.mg,l=f*+p.lh,s=+p.ls,v=p.dir==='v',limit=(v?1350:1080)-2*m;g.fillStyle=p.bg;g.fillRect(0,0,1080,1350);g.fillStyle=p.fg;g.font=`${f}px ${p.font==='serif'?'"Hiragino Mincho ProN", "Yu Mincho", serif':'"Hiragino Sans", "Yu Gothic", sans-serif'}`;g.textBaseline='middle';let lines=[];for(let para of p.txt.split('\n')){let line=[],w=0;for(let ch of Array.from(para)){let a=v?f+s:g.measureText(ch).width+s;if(line.length&&w+a>limit&&!/^[、。！？）」』】]/.test(ch)){lines.push(line);line=[];w=0}line.push(ch);w+=a}lines.push(line)}let max=Math.floor(((v?1080:1350)-2*m-f)/l)+1;lines.slice(0,max).forEach((line,j)=>{let pos=m;line.forEach(ch=>{if(v){let x=1080-m-f/2-j*l,y=pos+f/2;g.textAlign='center';g.save();g.translate(x,y);if(/[ー―（）「」『』【】]/.test(ch))g.rotate(Math.PI/2);if(/[、。]/.test(ch)){g.translate(f*.30,-f*.30)}g.fillText(ch,0,0);g.restore();pos+=f+s}else{g.textAlign='left';g.fillText(ch,pos,m+f/2+j*l);pos+=g.measureText(ch).width+s}})});if(p.sig){g.font='25px sans-serif';g.textAlign='center';g.fillText('ordinary._.but',540,1300)}return lines.length>max}function draw(){$('fsout').value=$('fs').value;$('mgout').value=$('mg').value;$('warn').textContent=render(pages[i])?'文章が収まりません。文字サイズ・余白を調整するか、次ページに分けてください。':''}function download(n){if(render(pages[n])){alert(`${n+1}ページ目の文章が収まりません`);draw();return}let a=document.createElement('a');a.download=`ordinary-${String(n+1).padStart(2,'0')}.png`;a.href=c.toDataURL('image/png');a.click();draw()}$('txt').oninput=update;keys.forEach(k=>$(k).oninput=update);$('prev').onclick=()=>{if(i>0)i--;load()};$('next').onclick=()=>{if(i<pages.length-1)i++;load()};$('add').onclick=()=>{pages.splice(i+1,0,{...pages[i],txt:''});i++;persist();load()};$('del').onclick=()=>{if(pages.length>1&&confirm('このページを削除しますか？')){pages.splice(i,1);i=Math.max(0,i-1);persist();load()}};function sharePages(ns){const files=[];for(const n of ns){if(render(pages[n])){alert(`${n+1}ページ目の文章が収まりません`);draw();return}const data=c.toDataURL('image/png').split(',')[1],bytes=Uint8Array.from(atob(data),x=>x.charCodeAt(0));files.push(new File([bytes],`ordinary-${String(n+1).padStart(2,'0')}.png`,{type:'image/png'}))}draw();const status=$('sharestatus'),fallback=$('fallback');fallback.replaceChildren();function showImages(){status.textContent='画像を長押しして「写真に保存」を選んでください。';for(const file of files){const url=URL.createObjectURL(file),img=document.createElement('img');img.src=url;img.style.cssText='display:block;max-width:100%;margin:12px auto';img.alt=file.name;fallback.append(img);const a=document.createElement('a');a.href=url;a.download=file.name;a.textContent=file.name+' をダウンロード';fallback.append(a)}}try{if(navigator.share&&navigator.canShare&&navigator.canShare({files})){navigator.share({files}).then(()=>{status.textContent='共有メニューを閉じました。写真アプリで保存を確認してください。'}).catch(e=>{if(e.name!=='AbortError')showImages()});return}}catch(e){}showImages()}$('save').onclick=()=>sharePages([i]);$('all').onclick=()=>sharePages(pages.map((_,n)=>n));load();</script></html>
